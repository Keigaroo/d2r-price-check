# Builds D2RPriceCheck.exe on a Windows machine and publishes it as a GitHub release.
# Runs when d2pc/version.py changes on main (or by hand from the Actions tab).
# If a release for that version already exists, nothing happens.
# Every installed copy (exe or zip install) picks up the new release the next time it starts.
name: Build and release

on:
  push:
    branches: [main]
    paths: ["d2pc/version.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('d2pc/version.py').read()).group(1))")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$v already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install
        if: steps.ver.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        if: steps.ver.outputs.exists == 'false'
        run: |
          python tests/test_core.py
          python tests/test_tooltip.py
          python tests/test_real_captures.py
          python tests/test_pricer.py
      - name: Build exe
        if: steps.ver.outputs.exists == 'false'
        run: >
          pyinstaller --onefile --name D2RPriceCheck --console
          --add-data "d2pc/data/items.json;d2pc/data"
          --collect-all winrt --collect-all curl_cffi --collect-all rapidfuzz
          --hidden-import keyboard --hidden-import mss
          run_exe.py
      - name: Smoke test exe
        if: steps.ver.outputs.exists == 'false'
        run: dist\D2RPriceCheck.exe --version
      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: D2R Price Check ${{ steps.ver.outputs.tag }}
          files: dist/D2RPriceCheck.exe
          generate_release_notes: true

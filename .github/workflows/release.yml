# Builds D2RPriceCheck.exe on a Windows machine and publishes it as a GitHub release
# whenever a version tag (e.g. v1.2.1) is pushed. Every installed copy picks it up on next start.
name: Build and release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Check version matches tag
        shell: bash
        run: |
          v=$(python -m d2pc.main --version)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "version.py says $v but tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Tests
        run: |
          python tests/test_core.py
          python tests/test_tooltip.py
          python tests/test_real_captures.py
      - name: Build exe
        run: >
          pyinstaller --onefile --name D2RPriceCheck --console
          --add-data "d2pc/data/items.json;d2pc/data"
          --collect-all winrt --collect-all curl_cffi --collect-all rapidfuzz
          --hidden-import keyboard --hidden-import mss
          run_exe.py
      - name: Smoke test exe
        run: dist\D2RPriceCheck.exe --version
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/D2RPriceCheck.exe
          generate_release_notes: true
